<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موسوعة الفيزياء 3D المرئية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0714;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(18, 12, 30, 0.95);
            padding: 15px 30px;
            border-bottom: 1px solid #3b1f57;
            text-align: center;
        }

        header h1 {
            font-size: 1.4rem;
            color: #e879f9;
            text-shadow: 0 0 12px rgba(232, 121, 249, 0.5);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
        }

        .sidebar {
            width: 380px;
            background: #130c21;
            border-left: 1px solid #3b1f57;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: #d8b4fe;
            font-weight: 600;
        }

        select {
            background: #1b122c;
            border: 1px solid #581c87;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
        }

        select:focus {
            border-color: #e879f9;
            box-shadow: 0 0 10px rgba(232, 121, 249, 0.4);
        }

        .video-container {
            flex: 1;
            background: #050308;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }

        .video-wrapper {
            width: 100%;
            max-width: 900px;
            height: 100%;
            max-height: 550px;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #581c87;
            box-shadow: 0 10px 30px rgba(126, 34, 206, 0.3);
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .info-box {
            margin-top: auto;
            background: rgba(88, 28, 135, 0.2);
            border: 1px solid #7e22ce;
            padding: 15px;
            border-radius: 10px;
        }

        .info-box h3 {
            color: #f472b6;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .info-box p {
            font-size: 0.85rem;
            color: #d1d5db;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎥 محاكي القوانين الفيزيائية بالفيديوهات 3D</h1>
    </header>

    <div class="main-container">
        <!-- القائمة الجانبية -->
        <div class="sidebar">
            <div class="control-group">
                <label for="physics-select">اختر القانون الفيزيائي:</label>
                <select id="physics-select">
                    <option value="newton">قانون نيوتن الثاني (Newton's Second Law)</option>
                    <option value="ohm">قانون أوم للكهرباء (Ohm's Law)</option>
                    <option value="kinetic">طاقة الحركة (Kinetic Energy)</option>
                    <option value="gravity">الجاذبية وسقوط الأجسام (Gravity & Free Fall)</option>
                </select>
            </div>

            <div class="info-box">
                <h3 id="info-title">قانون نيوتن الثاني</h3>
                <p id="info-desc">يوضح العلاقة بين القوة المؤثرة على جسم، كتلته، والعجلة الناتجة عن هذه القوة ($F = ma$).</p>
            </div>
        </div>

        <!-- منطقة عرض الفيديو 3D -->
        <div class="video-container">
            <div class="video-wrapper">
                <iframe id="physics-video" src="https://www.youtube.com/embed/1f9o2825l3I?autoplay=1&mute=1&loop=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <script>
        const physicsSelect = document.getElementById('physics-select');
        const videoFrame = document.getElementById('physics-video');
        const infoTitle = document.getElementById('info-title');
        const infoDesc = document.getElementById('info-desc');

        // بيانات القوانين والفيديوهات الـ 3D الخاصة بها
        const physicsData = {
            newton: {
                title: "قانون نيوتن الثاني",
                desc: "يوضح العلاقة بين القوة المؤثرة على جسم، كتلته، والعجلة الناتجة عن هذه القوة (F = ma).",
                videoUrl: "https://www.youtube.com/embed/1f9o2825l3I?autoplay=1"
            },
            ohm: {
                title: "قانون أوم للكهرباء",
                desc: "يشرح العلاقة بين الجهد (Voltage) والتيار (Current) والمقاومة (Resistance) في الدوائر الكهربائية (V = IR).",
                videoUrl: "https://www.youtube.com/embed/hs3p3liJjCs?autoplay=1"
            },
            kinetic: {
                title: "طاقة الحركة (Kinetic Energy)",
                desc: "يعرض كيفية تأثير كتلة الجسم وسرعته المضاعفة على طاقة حركته الكلية (KE = 0.5mv²).",
                videoUrl: "https://www.youtube.com/embed/w4QFJb9a8vo?autoplay=1"
            },
            gravity: {
                title: "الجاذبية وسقوط الأجسام",
                desc: "يوضح تأثير عجلة الجاذبية الأرضية على تسارع الأجسام أثناء سقوطها بغض النظر عن كتلتها.",
                videoUrl: "https://www.youtube.com/embed/MTY1Kje0y3g?autoplay=1"
            }
        };

        physicsSelect.addEventListener('change', (e) => {
            const selected = physicsData[e.target.value];
            if (selected) {
                videoFrame.src = selected.videoUrl;
                infoTitle.innerText = selected.title;
                infoDesc.innerText = selected.desc;
            }
        });
    </script>
</body>
</html>
