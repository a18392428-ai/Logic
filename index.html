<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الفيزياء الحقيقي 3D - مدعوم بالحسابات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- مكتبة التحكم بالكاميرا OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background-color: #0b0714;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            background: rgba(18, 12, 30, 0.95);
            padding: 15px 30px;
            border-bottom: 1px solid #3b1f57;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.4rem;
            color: #e879f9;
            text-shadow: 0 0 12px rgba(232, 121, 249, 0.5);
        }

        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 65px);
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
        }

        .sidebar {
            width: 380px;
            background: #130c21;
            border-left: 1px solid #3b1f57;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: 50vh;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.85rem;
            color: #d8b4fe;
            font-weight: 600;
        }

        select, input {
            background: #1b122c;
            border: 1px solid #581c87;
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        select:focus, input:focus {
            border-color: #e879f9;
            box-shadow: 0 0 10px rgba(232, 121, 249, 0.4);
        }

        .inputs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .input-box label {
            font-size: 0.75rem;
            color: #c084fc;
        }

        .btn {
            background: linear-gradient(135deg, #7e22ce, #be185d);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(126, 34, 206, 0.4);
        }

        .btn:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(190, 24, 93, 0.5);
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at center, #1c1134 0%, #07040e 100%);
        }

        #webgl-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .info-overlay {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(11, 7, 20, 0.9);
            border: 1px solid #7e22ce;
            padding: 15px;
            border-radius: 12px;
            max-width: 340px;
            backdrop-filter: blur(8px);
        }

        .info-overlay h3 {
            color: #f472b6;
            margin-bottom: 5px;
            font-size: 1rem;
        }

        .info-overlay p {
            font-size: 0.8rem;
            color: #d1d5db;
            line-height: 1.4;
        }

        .math-result {
            margin-top: 8px;
            padding: 8px;
            background: rgba(88, 28, 135, 0.3);
            border-right: 3px solid #e879f9;
            font-size: 0.85rem;
            color: #f3e8ff;
        }
    </style>
</head>
<body>

    <header>
        <h1>⚛️ المحاكي الفيزيائي الحسابي 3D</h1>
        <span style="font-size: 0.75rem; color: #c084fc;">إدخال الأرقام ← معالجة الحسابات ← تصيير 3D فيزيائي دقيق</span>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="control-group">
                <label for="physics-select">اختر العملية/القانون الفيزيائي:</label>
                <select id="physics-select">
                    <option value="newton">قانون نيوتن الثاني (F = m × a)</option>
                    <option value="ohm">قانون أوم للكهرباء (V = I × R)</option>
                    <option value="kinetic">طاقة الحركة (KE = 0.5 × m × v²)</option>
                </select>
            </div>

            <!-- لوحة إدخال المتغيرات الحقيقية -->
            <div class="control-group" id="dynamic-inputs">
                <!-- سيتم تعبئتها ديناميكياً حسب القانون المختاره -->
            </div>

            <button class="btn" id="calculate-btn">حساب وتحديث المشهد 3D</button>

            <div class="info-overlay" style="position: static; max-width: 100%; margin-top: auto;">
                <h3>النتائج الحسابية:</h3>
                <div class="math-result" id="calculation-output">أدخل القيم واضغط حساب لبدء المحاكاة.</div>
            </div>
        </div>

        <div class="canvas-container">
            <canvas id="webgl-canvas"></canvas>
            
            <div class="info-overlay">
                <h3 id="info-title">قانون نيوتن الثاني</h3>
                <p id="info-desc">العجلة الناتجة تتناسب طردياً مع القوة وعكسياً مع الكتلة.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

        renderer.setSize(canvas.clientWidth, canvas.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // الإضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xe879f9, 2.5, 60);
        pointLight.position.set(6, 8, 6);
        scene.add(pointLight);

        camera.position.set(0, 3, 7);
        controls.target.set(0, 0, 0);
        controls.update();

        let simulationObjects = [];
        let physicsData = { type: 'newton', calculatedValue: 1, scaleFactor: 1 };

        function clearScene() {
            simulationObjects.forEach(obj => scene.remove(obj));
            simulationObjects = [];
        }

        // تحديث خانات الإدخال بناءً على القانون المختار
        const inputsContainer = document.getElementById('dynamic-inputs');
        function updateInputsTemplate(type) {
            inputsContainer.innerHTML = '';
            if (type === 'newton') {
                inputsContainer.innerHTML = `
                    <div class="inputs-grid">
                        <div class="input-box"><label>القوة F (نيوتن):</label><input type="number" id="val-f" value="10"></div>
                        <div class="input-box"><label>الكتلة m (كجم):</label><input type="number" id="val-m" value="2"></div>
                    </div>
                `;
            } else if (type === 'ohm') {
                inputsContainer.innerHTML = `
                    <div class="inputs-grid">
                        <div class="input-box"><label>التيار I (أمبير):</label><input type="number" id="val-i" value="3"></div>
                        <div class="input-box"><label>المقاومة R (أوم):</label><input type="number" id="val-r" value="4"></div>
                    </div>
                `;
            } else if (type === 'kinetic') {
                inputsContainer.innerHTML = `
                    <div class="inputs-grid">
                        <div class="input-box"><label>الكتلة m (كجم):</label><input type="number" id="val-mk" value="4"></div>
                        <div class="input-box"><label>السرعة v (م/ث):</label><input type="number" id="val-v" value="5"></div>
                    </div>
                `;
            }
        }

        updateInputsTemplate('newton');

        document.getElementById('physics-select').addEventListener('change', (e) => {
            updateInputsTemplate(e.target.value);
        });

        // دالة الحسابات والربط بالـ 3D
        function processPhysicsAndBuild() {
            clearScene();
            const type = document.getElementById('physics-select').value;
            physicsData.type = type;

            if (type === 'newton') {
                let F = parseFloat(document.getElementById('val-f').value) || 1;
                let m = parseFloat(document.getElementById('val-m').value) || 1;
                let a = F / m; // العجلة الحقيقية

                document.getElementById('calculation-output').innerHTML = 
                    `العجلة ($a$) = $F / m$ = ${F} / ${m} = <b>${a.toFixed(2)} م/ث²</b>`;
                document.getElementById('info-title').innerText = "قانون نيوتن الثاني";
                document.getElementById('info-desc').innerText = `حجم الجسم يعكس الكتلة (${m} كجم)، وسرعة الحركة تعكس العجلة الناتجة (${a.toFixed(2)}).`;

                // بناء الشكل 3D بناءً على الكتلة والعجلة
                const size = Math.max(0.5, Math.min(2.5, m * 0.4)); // الكتلة بتحدد الحجم
                const geom = new THREE.BoxGeometry(size, size, size);
                const mat = new THREE.MeshStandardMaterial({ color: 0x9f1239, roughness: 0.2, metalness: 0.8 });
                const cube = new THREE.Mesh(geom, mat);
                scene.add(cube);
                simulationObjects.push(cube);
                physicsData.scaleFactor = a; // السرعة متناسبة مع العجلة

            } else if (type === 'ohm') {
                let I = parseFloat(document.getElementById('val-i').value) || 1;
                let R = parseFloat(document.getElementById('val-r').value) || 1;
                let V = I * R; // الجهد الحقيقي

                document.getElementById('calculation-output').innerHTML = 
                    `الجهد ($V$) = $I \\times R$ = ${I} × ${R} = <b>${V.toFixed(2)} فولت</b>`;
                document.getElementById('info-title').innerText = "قانون أوم (الكهرباء)";
                document.getElementById('info-desc').innerText = `الجهد المحسوب (${V.2f}V) يدفع التيار (${I}A) عبر المقاومة (${R}\u03A9).`;

                const group = new THREE.Group();
                // السلك
                const wireGeom = new THREE.CylinderGeometry(0.1, 0.1, 4, 16);
                const wireMat = new THREE.MeshStandardMaterial({ color: 0x581c87, roughness: 0.5 });
                const wire = new THREE.Mesh(wireGeom, wireMat);
                wire.rotation.z = Math.PI / 2;
                group.add(wire);

                // المقاومة يتغير حجمها بحسب قيمة R
                const resRadius = Math.max(0.2, Math.min(0.6, R * 0.1));
                const resistorGeom = new THREE.TorusGeometry(resRadius, 0.08, 16, 32);
                const resistorMat = new THREE.MeshStandardMaterial({ color: 0xbe185d, metalness: 0.8 });
                const resistor = new THREE.Mesh(resistorGeom, resistorMat);
                group.add(resistor);

                // الإلكترونات سرعتها تعتمد على التيار I
                const electronsGroup = new THREE.Group();
                for (let i = 0; i < 10; i++) {
                    const electronGeom = new THREE.SphereGeometry(0.08, 16, 16);
                    const electronMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x38bdf8 });
                    const electron = new THREE.Mesh(electronGeom, electronMat);
                    electron.position.x = (i - 4.5) * 0.35;
                    electronsGroup.add(electron);
                }
                group.add(electronsGroup);
                group.userData = { electrons: electronsGroup, speed: I };

                scene.add(group);
                simulationObjects.push(group);

            } else if (type === 'kinetic') {
                let mk = parseFloat(document.getElementById('val-mk').value) || 1;
                let v = parseFloat(document.getElementById('val-v').value) || 1;
                let KE = 0.5 * mk * Math.pow(v, 2); // طاقة الحركة الحقيقية

                document.getElementById('calculation-output').innerHTML = 
                    `طاقة الحركة ($KE$) = $0.5 \\cdot m \\cdot v^2$ = <b>${KE.toFixed(2)} جول</b>`;
                document.getElementById('info-title').innerText = "طاقة الحركة (Kinetic Energy)";
                document.getElementById('info-desc').innerText = `الطاقة الناتجة (${KE.toFixed(2)} J) تتأثر بالسرعة بشكل مضاعف ($v^2$).`;

                const geom = new THREE.SphereGeometry(Math.max(0.4, Math.min(1.5, mk * 0.3)), 32, 32);
                const mat = new THREE.MeshStandardMaterial({ color: 0x7e22ce, roughness: 0.2 });
                const sphere = new THREE.Mesh(geom, mat);
                scene.add(sphere);
                simulationObjects.push(sphere);
                physicsData.scaleFactor = v;
            }
        }

        // تشغيل البناء الأولي
        processPhysicsAndBuild();

        document.getElementById('calculate-btn').addEventListener('click', () => {
            processPhysicsAndBuild();
        });

        // حلقة الأنيماشن الحسابية
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let elapsedTime = clock.getElapsedTime();

            if (physicsData.type === 'newton' && simulationObjects.length > 0) {
                let cube = simulationObjects[0];
                cube.rotation.x = elapsedTime * 0.5;
                // الحركة الأفقية مرتبطة بالقيمة الحسابية للعجلة
                cube.position.x = Math.sin(elapsedTime * physicsData.scaleFactor * 0.5) * 1.5;
            } else if (physicsData.type === 'ohm' && simulationObjects.length > 0) {
                let ohmGroup = simulationObjects[0];
                let electrons = ohmGroup.userData.electrons;
                let speedMultiplier = ohmGroup.userData.speed || 1;
                if (electrons) {
                    electrons.children.forEach((elec, index) => {
                        // سرعة سريان الإلكترونات مرتبطة بقيمة التيار (I) الحسابية
                        elec.position.x = (((elapsedTime * speedMultiplier * 0.8 + index * 0.35)) % 4) - 2;
                    });
                }
            } else if (physicsData.type === 'kinetic' && simulationObjects.length > 0) {
                let sphere = simulationObjects[0];
                sphere.rotation.y = elapsedTime * 0.5;
                // الاهتزاز والسرعة تتأثر بقيمة v
                sphere.position.x = Math.sin(elapsedTime * physicsData.scaleFactor * 0.4) * 2;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            const width = canvas.parentElement.clientWidth;
            const height = canvas.parentElement.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
