<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاكي الفيزياء الحسابي 3D</title>
    <!-- خط القاهرة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- ملف الـ CSS المنفصل -->
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة Three.js ومكتبة التحكم بالكاميرا -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <header>
        <h1>⚛️ المحاكي الفيزيائي الحسابي 3D</h1>
        <span style="font-size: 0.75rem; color: #c084fc;">هندسة برمجيات نظيفة - متعدد الملفات</span>
    </header>

    <div class="main-container">
        <!-- لوحة التحكم الجانبية -->
        <div class="sidebar">
            <div class="control-group">
                <label for="physics-select">اختر القانون الفيزيائي:</label>
                <select id="physics-select">
                    <option value="newton">قانون نيوتن الثاني (F = m × a)</option>
                    <option value="ohm">قانون أوم للكهرباء (V = I × R)</option>
                    <option value="kinetic">طاقة الحركة (KE = 0.5 × m × v²)</option>
                </select>
            </div>

            <!-- خانات الإدخال الديناميكية -->
            <div class="control-group" id="dynamic-inputs"></div>

            <button class="btn" id="calculate-btn">حساب وتحديث المشهد 3D</button>

            <div class="info-overlay" style="position: static; max-width: 100%; margin-top: auto;">
                <h3>النتائج الحسابية:</h3>
                <div class="math-result" id="calculation-output">أدخل القيم واضغط حساب لبدء المحاكاة.</div>
            </div>
        </div>

        <!-- مساحة عرض الـ 3D -->
        <div class="canvas-container">
            <canvas id="webgl-canvas"></canvas>
            
            <div class="info-overlay">
                <h3 id="info-title">قانون نيوتن الثاني</h3>
                <p id="info-desc">العجلة الناتجة تتناسب طردياً مع القوة وعكسياً مع الكتلة.</p>
            </div>
        </div>
    </div>

    <!-- ملف الـ JavaScript المنفصل -->
    <script src="app.js"></script>
</body>
</html>
